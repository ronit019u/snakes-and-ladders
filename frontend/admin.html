<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSnake · Game Master</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div class="topbar">
    <span class="dot" id="socket-dot"></span> Socket: <span id="socket-status">connecting…</span>
    &nbsp;|&nbsp; API: <input type="text" id="api-base" value="http://localhost:5000" style="width:190px;">
    <button id="reconnect-api-btn" class="btn-secondary" style="margin-top:0;padding:4px 8px;">Apply</button>
  </div>

  <div class="wrap">
    <div>
      <!-- ===== LOGIN ===== -->
      <div class="card" id="login-card">
        <h1>🕹️ CyberSnake — Game Master</h1>
        <label>Admin Username</label>
        <input type="text" id="admin-user" placeholder="admin">
        <label>Password</label>
        <input type="password" id="admin-pass" placeholder="••••••••">
        <button class="btn-primary" id="login-btn">🔐 Log In</button>
        <div id="login-msg"></div>
      </div>

      <!-- ===== SESSION SETUP (post-login) ===== -->
      <div class="card hidden" id="setup-card">
        <h2>Create Session</h2>
        <label>Preset</label>
        <select id="preset-select"><option value="default">Default</option></select>
        <button class="btn-primary" id="create-room-btn">➕ Create Room</button>
        <div id="setup-msg"></div>
        <div id="session-info" class="hidden">
          <div class="session-code" id="session-code-display"></div>
          <button class="btn-primary" id="start-btn" style="width:100%;">▶️ Start Game</button>
          <button class="btn-secondary" id="spawn-robots-btn" style="width:100%;margin-top:8px;">🤖 Spawn 25 Bots</button>
          <div id="bots-msg"></div>
        </div>
      </div>

      <!-- ===== BOARD (post start) ===== -->
      <div class="card hidden" id="board-card">
        <h2>Live Board</h2>
        <div class="board" id="board"></div>
      </div>
    </div>

    <div>
      <!-- ===== PLAYER LIST ===== -->
      <div class="card hidden" id="roster-card">
        <h2>Players (<span id="player-count">0</span>/25)</h2>
        <div id="player-list"></div>
      </div>

      <!-- ===== PRESET CONFIG ===== -->
      <div class="card hidden" id="preset-card">
        <h2>Session Presets</h2>
        <label>Preset ID (save as)</label>
        <input type="text" id="preset-id-input" value="my_preset">
        <label>Display Name</label>
        <input type="text" id="p-display-name" value="My Preset">

        <h3 style="margin:14px 0 6px;font-size:13px;color:#94a3b8;">Base Settings</h3>
        <div class="preset-grid">
          <div><label>Max Players</label><input type="number" id="p-max-players" value="25"></div>
          <div><label>Dice Max</label><input type="number" id="p-dice-max" value="6"></div>
          <div><label>Quiz Timeout (s)</label><input type="number" id="p-quiz-timeout" value="15"></div>
          <div><label>Bonus Timeout (s)</label><input type="number" id="p-bonus-timeout" value="15"></div>
          <div><label>Leaderboard Rows</label><input type="number" id="p-leaderboard-count" value="5"></div>
        </div>

        <h3 style="margin:14px 0 6px;font-size:13px;color:#94a3b8;">Flashing Tile</h3>
        <div class="preset-grid">
          <div><label>Blue Tile Prob (%)</label><input type="number" id="p-blue" value="30" min="0" max="100"></div>
          <div><label>Red Tile Prob (%)</label><input type="number" id="p-red" value="30" min="0" max="100"></div>
          <div><label>Item Prob on Blue (%)</label><input type="number" id="p-item" value="50" min="0" max="100"></div>
          <div><label>Red Penalty Steps</label><input type="number" id="p-penalty" value="2"></div>
        </div>
        <label style="margin-top:8px;">Blue-tile Item Pool (weights)</label>
        <div class="preset-grid">
          <div><label>🚀 Rocket</label><input type="number" id="p-pool-rocket" value="5"></div>
          <div><label>💣 Bomb</label><input type="number" id="p-pool-bomb" value="3"></div>
          <div><label>🏹 Arrow</label><input type="number" id="p-pool-arrow" value="2"></div>
        </div>

        <h3 style="margin:14px 0 6px;font-size:13px;color:#94a3b8;">Earthquake</h3>
        <div class="preset-grid">
          <div><label>Magnitude (steps)</label><input type="number" id="p-quake-mag" value="3"></div>
          <div><label>Interval (s)</label><input type="number" id="p-quake-int" value="60"></div>
        </div>

        <h3 style="margin:14px 0 6px;font-size:13px;color:#94a3b8;">Bonus Round</h3>
        <div class="preset-grid">
          <div><label>Interval (s)</label><input type="number" id="p-bonus-int" value="180"></div>
          <div><label>Wrong-Answer Penalty Steps</label><input type="number" id="p-bonus-penalty" value="2"></div>
        </div>
        <label style="margin-top:8px;">Reward Pool (weights)</label>
        <div class="preset-grid">
          <div><label>🚀 Rocket</label><input type="number" id="p-reward-rocket" value="4"></div>
          <div><label>💣 Bomb</label><input type="number" id="p-reward-bomb" value="2"></div>
          <div><label>🏹 Arrow</label><input type="number" id="p-reward-arrow" value="2"></div>
          <div><label>➡️ Forward</label><input type="number" id="p-reward-forward" value="2"></div>
        </div>
        <div><label>Forward Reward Steps</label><input type="number" id="p-bonus-forward-steps" value="3"></div>

        <h3 style="margin:14px 0 6px;font-size:13px;color:#94a3b8;">Items</h3>
        <div class="preset-grid">
          <div><label><input type="checkbox" id="p-item-rocket-enabled" checked style="width:auto;display:inline-block;margin-right:6px;">🚀 Rocket Enabled</label><input type="number" id="p-item-rocket-steps" value="5" placeholder="steps"></div>
          <div><label><input type="checkbox" id="p-item-bomb-enabled" checked style="width:auto;display:inline-block;margin-right:6px;">💣 Bomb Enabled</label><input type="number" id="p-item-bomb-steps" value="5" placeholder="steps"></div>
          <div><label><input type="checkbox" id="p-item-arrow-enabled" checked style="width:auto;display:inline-block;margin-right:6px;">🏹 Arrow Enabled</label><input type="number" id="p-item-arrow-steps" value="3" placeholder="steps"></div>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" id="save-preset-btn">💾 Save Preset</button>
          <button class="btn-secondary" id="load-preset-btn">📂 Load Preset</button>
        </div>
        <div id="preset-msg"></div>
      </div>

      <!-- ===== QUESTION BANK ===== -->
      <div class="card hidden" id="question-card">
        <h2>Question Bank Upload</h2>
        <div class="file-drop">CSV format: question,optA,optB,optC,optD,correctLetter,difficulty,topic</div>
        <input type="file" id="question-file" accept=".csv,.xlsx,.xls" style="margin-top:8px;">
        <label style="margin-top:8px;">Upload Mode</label>
        <select id="question-mode">
          <option value="append" selected>Append (keep existing questions)</option>
          <option value="replace">Replace (wipe bank, renumber from Q001)</option>
        </select>
        <button class="btn-primary" id="upload-questions-btn">⬆️ Upload</button>
        <div id="question-msg"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/adminApp.js"></script>
</body>
</html>
