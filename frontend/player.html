<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSnake · Player</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div class="topbar">
    <span class="dot" id="socket-dot"></span> Socket:
    <span id="socket-status">connecting…</span>
    &nbsp;|&nbsp; API:
    <input type="text" id="api-base" value="http://localhost:5000" style="width:190px;">
    <button id="reconnect-api-btn" class="btn-secondary" style="margin-top:0;padding:4px 8px;">Apply</button>
  </div>

  <div class="panel">

    <!-- ===== JOIN SCREEN ===== -->
    <div id="join-screen">
      <h1>🎮 CyberSnake — Player</h1>
      <label>Your Username</label>
      <input type="text" id="username-input" placeholder="e.g. Alice">

      <button class="btn-primary" id="create-btn">➕ Create New Session</button>

      <label style="margin-top:18px;">— OR —</label>
      <label>Session Code</label>
      <input type="text" id="session-input" placeholder="Paste a session ID to join">
      <button class="btn-secondary" id="join-btn">🔑 Join Session</button>

      <div id="join-msg"></div>
    </div>

    <!-- ===== WAITING ROOM ===== -->
    <div id="waiting-screen" class="hidden">
      <h1>⏳ Waiting Room</h1>
      <p style="font-size:13px;color:#94a3b8;">Share this code with other players:</p>
      <div class="session-code" id="session-code-display">------</div>
      <div id="waiting-players"></div>
      <button class="btn-primary hidden" id="start-game-btn">▶️ Start Game (Host Only)</button>
      <div id="waiting-msg"></div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="game-screen" class="hidden">
      <div class="hud">
        <span id="my-status">You: —</span>
        <span id="game-status-label">InProgress</span>
      </div>

      <div class="leaderboard" id="leaderboard"></div>
      <div class="board" id="board"></div>

      <!-- 3D Dice -->
      <div id="dice-container">
        <div id="dice" class="dice-3d">
          <div class="face face-1">⚀</div>
          <div class="face face-2">⚁</div>
          <div class="face face-3">⚂</div>
          <div class="face face-4">⚃</div>
          <div class="face face-5">⚄</div>
          <div class="face face-6">⚅</div>
        </div>
      </div>

      <div class="roll-bar">
        <button class="btn-primary" id="roll-btn">🎲 Roll Dice</button>
      </div>

      <label>Inventory</label>
      <div class="inventory" id="inventory"></div>

      <div id="game-msg"></div>
    </div>

  </div>

  <!-- ===== QUIZ OVERLAY ===== -->
  <div class="overlay" id="quiz-overlay">
    <div class="modal">
      <div style="font-size:11px;color:#94a3b8;">🔐 Cybersecurity Quiz</div>
      <div class="quiz-timer" id="quiz-timer">15</div>
      <div id="quiz-question" style="font-weight:700;margin-bottom:6px;"></div>
      <div id="quiz-options"></div>
      <div id="quiz-result" style="margin-top:10px;font-weight:700;"></div>
    </div>
  </div>

  <!-- ===== ITEM TARGET OVERLAY ===== -->
  <div class="overlay" id="target-overlay">
    <div class="modal">
      <div id="target-title" style="font-weight:700;margin-bottom:8px;">💣 Select a target</div>
      <div class="target-list" id="target-list"></div>
      <button class="btn-secondary" id="target-cancel-btn">Cancel</button>
    </div>
  </div>

  <!-- ===== BONUS ROUND OVERLAY ===== -->
  <div class="overlay" id="bonus-overlay">
    <div class="modal">
      <div style="font-size:11px;color:#94a3b8;">⚡ Bonus Round — first correct answer wins!</div>
      <div class="quiz-timer" id="bonus-timer">15</div>
      <div id="bonus-question" style="font-weight:700;margin-bottom:6px;"></div>
      <div id="bonus-options"></div>
      <div id="bonus-result" style="margin-top:10px;font-weight:700;"></div>
    </div>
  </div>

  <script type="module" src="js/playerApp.js"></script>
</body>
</html>
